<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mini-loja</title>
</head>

<body>
    <h1>mini loja</h1>
    <nav>
        <ol>
            <li><a href="#produtos">produtos</a></li>
            <li><a href="#video"> video</a></li>
        </ol>
    </nav>
    <section id="produtos">
        <h2>produtos</h2>
        <article>
            <h3>smartphone</h3>
            <figure>
                <img src="assets/iphone.jpg" alt="iphone 17 pro max laranja, frente e verso" width="250" height="250"
                    loading="lazy">
                <figcaption>iphone 17 pro max - R$ 5999,99</figcaption>
                <!--- aparece somente isso , sem aparecer a imagem,""iphone 17 pro max laranja, frente e verso"-->
            </figure>
        </article>
        <article>
            <h3>Camiseta</h3>
            <figure>
                <img src="assets/camisa.jpg" alt="Camiseta branca" width="250" height="250" loading="lazy">

                <figcaption>Camiseta branca - R$ 59,99</figcaption>
            </figure>
        </article>
    </section>
    <section id="video">
        <video controls width="400" preload="metadata">
            <source src="assets/video.mp4" type="video/mp4">
            Seu navegador não suporta vídeo.
        </video>
    </section>
    <section id="audio">
        <h2>descricao de audio</h2>
        <audio controls preload="metadata">
            <source src="assets/descricao-produto.mp3" type="audio/mpeg">
            Seu navegador não suporta áudio.
        </audio>
    </section>
    <section>
        <h2>Conteúdo externo</h2>
        <iframe src="https://www.youtube.com/embed/yQ3UXggZK9Q" title="Vídeo sobre o Neymar" width="400" height="225"
            loading="lazy" denyfullscreen>
        </iframe>
    </section>
    <footer>
        <p>
        <blockquote>Gustavo de Fraga e Gabriel Bauer</blockquote>
        </p>
    </footer>
</body>

</html>
