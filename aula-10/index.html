<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="estilo.css">
  <title>Minha Loja Online</title>
</head>
<body>

  <header class="header">
    <h1>Minha Loja Online</h1>
    <nav class="nav-menu">
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Produtos</a></li>
        <li><a href="#">Contato</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="banner">
      <h2>Promoções Imperdíveis</h2>
      <p>Os melhores produtos com os melhores preços!</p>
    </section>

    <section class="products">
      <article class="product-card">
        <h3>Smartphone</h3>
        <p>Smartphone com alta tecnologia.</p>
        <button class="btn-primary">Comprar</button>
      </article>

      <article class="product-card">
        <h3>Camiseta</h3>
        <p>Camiseta de algodão premium.</p>
        <button class="btn-primary">Comprar</button>
      </article>

      <article class="product-card">
        <h3>Relógio</h3>
        <p>Relógio luxuoso.</p>
        <button class="btn-primary">Comprar</button>
      </article>
    </section>
  </main>

  <footer class="footer">
    <p>&copy; 2026 Minha Loja Online</p>
  </footer>

</body>
</html>
