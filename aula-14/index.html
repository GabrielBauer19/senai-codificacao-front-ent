<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Simples</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <div class="card-image">
    </div>
    <div class="card-content">
      <span class="card-tag">Frontend</span>
      <h2 class="card-title" id="cardTitulo">Desenvolvimento Web</h2>
      <p class="card-description" id="cardDescricao">
        Aprenda a estruturar páginas semânticas com HTML e criar designs modernos e responsivos utilizando CSS.
      </p>
      <button class="card-button" id="btnSaibaMais" type="button">Saiba mais</button>
    </div>
  </div>

    </div>

</html>
